zerops:
  - setup: scraper
    build:
      base: python@3.12
      addToRunPrepare:
        - requirements.txt
      deployFiles:
        - autobazary/
        - migrate_add_price_history.py
        - requirements.txt

    run:
      base: python@3.12
      os: alpine

      prepareCommands:
        - |
          sudo apk add --no-cache gcc musl-dev libffi-dev
          pip install --no-cache-dir -r /home/zerops/requirements.txt

      initCommands:
        - |
          cd /var/www
          python3 -c "
          import os
          url = os.environ.get('DATABASE_URL', 'NOT SET')
          # skryj heslo
          import re
          safe = re.sub(r':([^:@]+)@', ':***@', url)
          print('DATABASE_URL =', safe)
          "
          python migrate_add_price_history.py

      crontab:
        - command: cd /var/www && python -m autobazary.run scrape --sources all --pages 5
          timing: "0 * * * *"
