zerops:
  - setup: scraper
    build:
      base: python@3.12
      addToRunPrepare:
        - requirements.txt
      deployFiles:
        - autobazary/
        - migrate_add_price_history.py
        - requirements.txt

    run:
      base: python@3.12
      os: alpine

      prepareCommands:
        - |
          sudo apk add --no-cache gcc musl-dev libffi-dev
          pip install --no-cache-dir -r /home/zerops/requirements.txt

      initCommands:
        - |
          cd /var/www
          python migrate_add_price_history.py

      envVariables:
        # postgresql_connectionString je ve tvaru postgresql://user:pass@host:port/db
        # psycopg3 potřebuje postgresql+psycopg:// – nahradíme prefix
        DATABASE_URL: ${postgresql_connectionString}
        SCRAPE_DELAY: "2"
        SCRAPE_MAX_PAGES: "5"
        SCRAPE_DETAIL: "false"

      crontab:
        - command: cd /var/www && python -m autobazary.run scrape --sources all --pages 5
          timing: "0 * * * *"
