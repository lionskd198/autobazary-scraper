zerops:
  - setup: scraper
    build:
      base: python@3.12
      addToRunPrepare:
        - requirements.txt
      deployFiles:
        - autobazary/
        - dashboard/
        - migrate_add_price_history.py
        - requirements.txt

    run:
      base: python@3.12
      os: alpine

      prepareCommands:
        - |
          sudo apk add --no-cache gcc musl-dev libffi-dev
          pip install --no-cache-dir -r /home/zerops/requirements.txt

      initCommands:
        - cd /var/www && python migrate_add_price_history.py

      start: cd /var/www && uvicorn dashboard.api:app --host 0.0.0.0 --port 8000

      ports:
        - port: 8000
          httpSupport: true

      crontab:
        - command: cd /var/www && python -m autobazary.run scrape --sources all --pages 5
          timing: "0 */4 * * *"
